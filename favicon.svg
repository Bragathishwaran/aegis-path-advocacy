<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="45%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield / Squircle Background with crisp edge -->
  <rect width="64" height="64" rx="16" fill="url(#shieldGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  
  <!-- Bold, High-Visibility Inner Shield with Protective Fill -->
  <path d="M32 7 L53 15 C53 33 44 47 32 55 C20 47 11 33 11 15 Z" 
        fill="rgba(255,255,255,0.18)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
        
  <!-- Ascending Upper Chevron Wing (Pure White) -->
  <path d="M32 13.5 L47 25.5 L40.5 25.5 L32 19 L23.5 25.5 L17 25.5 Z" 
        fill="#ffffff" />
        
  <!-- Lower Chevron Wing -->
  <path d="M32 23 L44 33 L38.5 33 L32 28 L25.5 33 L20 33 Z" 
        fill="#ffffff" opacity="0.9" />

  <!-- Center Golden Star / Diamond Beacon -->
  <path d="M32 21 L35.5 33 L47.5 36 L35.5 39 L32 51 L28.5 39 L16.5 36 L28.5 33 Z" 
        fill="url(#goldAccent)" filter="url(#glow)"/>

  <!-- Core Brilliant Point -->
  <circle cx="32" cy="36" r="3.2" fill="#ffffff"/>
</svg>
